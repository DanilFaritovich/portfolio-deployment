apiVersion: portfolio.deployment/v1
kind: Application
metadata:
  id: support-assistant
  sourceRepository: fixtures/support-assistant
spec:
  enabled: false
  components:
  - name: frontend
    image: ghcr.io/fixtures/frontend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    platform: linux/amd64
    type: http
    health:
      strategy: http
      path: /health
    port: 8080
    dependsOn:
    - backend
  - name: backend
    image: ghcr.io/fixtures/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    platform: linux/amd64
    type: http
    health:
      strategy: http
      path: /health
    port: 8080
    configRefs:
    - app-config
    secretRefs:
    - api-token
    volumeMounts:
    - volume: data
      mountPath: /app/data
  - name: worker
    image: ghcr.io/fixtures/worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    platform: linux/amd64
    type: worker
    health:
      strategy: imageHealthcheck
  storage:
    type: persistent
    volumes:
    - name: data
  ingress:
    hostname: support.example.test
    component: frontend
    port: 8080
  configRefs:
  - app-config
  secretRefs:
  - api-token
