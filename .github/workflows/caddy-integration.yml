name: Caddy runtime acceptance

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: caddy-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  caddy-integration:
    name: Real Caddy isolated runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select integration scope
        id: scope
        run: python3 -m scripts.ci_scope >> "$GITHUB_OUTPUT"
      - name: Set up Python
        if: steps.scope.outputs.run_heavy == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        if: steps.scope.outputs.run_heavy == 'true'
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Verify disposable runner
        if: steps.scope.outputs.run_heavy == 'true'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = X64
          docker version --format '{{.Server.Version}}'
          docker compose version
      - name: Explicit isolated Caddy acceptance
        if: steps.scope.outputs.run_heavy == 'true'
        shell: bash
        run: |
          set -o pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,GITHUB_EVENT_NAME,GITHUB_REPOSITORY make caddy-integration-test PYTHON="$(command -v python)" CADDY_TEST_ENDPOINT=unix:///var/run/docker.sock CADDY_TEST_AUTHORIZE=disposable-caddy-integration | tee "$RUNNER_TEMP/caddy-acceptance.json"
      - name: Verify tracked files unchanged
        run: git diff --exit-code HEAD --
      - name: Preserve bounded sanitized report
        if: always() && steps.scope.outputs.run_heavy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caddy-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/caddy-acceptance.json
          if-no-files-found: warn
          retention-days: 30
