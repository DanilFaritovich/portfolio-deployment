name: ProjectRouter isolated acceptance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type project-router-v1.0.0-isolated to authorize disposable runner acceptance'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: project-router-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      github.repository == 'DanilFaritovich/portfolio-deployment' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      github.ref_protected &&
      inputs.confirmation == 'project-router-v1.0.0-isolated'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout reviewed manager revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Provision offline validator dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      # The entry point downloads gh 2.102.0, checks the pinned archive SHA-256
      # before execution, and rejects unsupported versions before attestations.
      - name: Accept exact immutable image with verified GitHub CLI in isolation
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_CONFIRM: ${{ inputs.confirmation }}
          ACCEPTANCE_REF_PROTECTED: ${{ github.ref_protected }}
        run: python -m scripts.project_router_acceptance
      - name: Preserve bounded sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: project-router-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-evidence/report.json
          if-no-files-found: warn
          retention-days: 30
