name: Production CD

on:
  workflow_dispatch:
    inputs:
      kind:
        description: One-time external observation only; grants no deployment authority
        type: choice
        options: [observe-initial]
        required: true
  workflow_run:
    workflows: [Manager trusted release]
    types: [completed]
    branches: [main]
  workflow_call:
    inputs:
      kind:
        type: string
        required: true
    secrets:
      CD_AUTOMATION_KEY_B64:
        # The protected job Environment supplies these; callers need not keep
        # duplicate repository-level secrets just to satisfy workflow_call.
        required: false
      CD_OBSERVER_KEY_B64:
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-cd-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       github.ref_protected && github.repository == 'DanilFaritovich/portfolio-deployment' &&
       inputs.kind == 'observe-initial') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.repository == 'DanilFaritovich/portfolio-deployment' ||
       (github.repository == 'DanilFaritovich/project-router' && inputs.kind == 'application')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Require reviewed immutable CD client
        env:
          CLIENT_SHA: ${{ vars.CD_MANAGER_CLIENT_SHA }}
        run: python -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}",os.environ["CLIENT_SHA"]), "Configure reviewed CD_MANAGER_CLIENT_SHA"'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: DanilFaritovich/portfolio-deployment
          ref: ${{ vars.CD_MANAGER_CLIENT_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: python -m pip install --quiet -r requirements-dev.txt
      - name: Fetch only evidence of the completed exact source run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ format('{0}-{1}-{2}', inputs.kind == 'application' && 'release-evidence' || 'manager-release', github.event.workflow_run.head_sha, github.event.workflow_run.run_attempt) }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release
      - name: Deploy through constrained bridge and independent HTTPS witness
        env:
          KIND: ${{ inputs.kind || 'manager' }}
          CD_HOST: ${{ vars.CD_HOST }}
          CD_PORT: ${{ vars.CD_PORT }}
          CD_USER: ${{ vars.CD_USER }}
          CD_KNOWN_HOSTS_B64: ${{ vars.CD_KNOWN_HOSTS_B64 }}
          CD_POLICY_ID: ${{ vars.CD_POLICY_ID }}
          CD_AUTOMATION_PRINCIPAL: ${{ vars.CD_AUTOMATION_PRINCIPAL }}
          CD_OBSERVER_PRINCIPAL: ${{ vars.CD_OBSERVER_PRINCIPAL }}
          CD_AUTOMATION_KEY_B64: ${{ github.event_name == 'workflow_run' && secrets.CD_AUTOMATION_KEY_B64 || '' }}
          CD_OBSERVER_KEY_B64: ${{ secrets.CD_OBSERVER_KEY_B64 }}
        run: python -m scripts.cd.runner "$KIND" "$RUNNER_TEMP/release"
