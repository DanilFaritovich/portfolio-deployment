name: Trusted Caddy image

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trusted-caddy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify inputs and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      BUILDX_BUILDER: default
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Validate Caddy producer contract offline
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m scripts.caddy_producer check
          python -m pytest -q -p no:cacheprovider tests/test_caddy_producer.py tests/test_caddy_registry_auth.py tests/test_caddy_app_auth.py
      - name: Authenticate immutable upstream inputs
        run: python -m scripts.caddy_producer prepare --directory "$RUNNER_TEMP/caddy-inputs"
      - name: Verify hosted builder policy and exact toolchain
        run: python -m scripts.caddy_producer toolchain-check
      - name: Build without network or package installation
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = X64
          /usr/bin/docker build --platform linux/amd64 --network none --pull \
            --label org.opencontainers.image.source=https://github.com/DanilFaritovich/portfolio-deployment \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "ghcr.io/danilfaritovich/portfolio-caddy:sha-$SOURCE_SHA" "$RUNNER_TEMP/caddy-inputs/context"
          /usr/bin/docker image inspect "ghcr.io/danilfaritovich/portfolio-caddy:sha-$SOURCE_SHA" > "$RUNNER_TEMP/caddy-inputs/built-image.json"
          python -m scripts.caddy_producer_build_check "$RUNNER_TEMP/caddy-inputs/built-image.json"
          /usr/bin/docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true "ghcr.io/danilfaritovich/portfolio-caddy:sha-$SOURCE_SHA" caddy version
          /usr/bin/docker save --output "$RUNNER_TEMP/caddy-inputs/image.tar" "ghcr.io/danilfaritovich/portfolio-caddy:sha-$SOURCE_SHA"
      - name: Retain exact build and public input evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caddy-build-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/caddy-inputs/image.tar
            ${{ runner.temp }}/caddy-inputs/built-image.json
            ${{ runner.temp }}/caddy-inputs/inputs.json
            ${{ runner.temp }}/caddy-inputs/base-signature-verification.json
            ${{ runner.temp }}/caddy-inputs/caddy.pem
            ${{ runner.temp }}/caddy-inputs/caddy.sig
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish trusted Caddy
    needs: build
    if: >-
      github.event_name == 'push' && github.repository == 'DanilFaritovich/portfolio-deployment' &&
      github.ref == 'refs/heads/main' && github.ref_protected
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/caddy-publish.yml
    secrets:
      source-app-private-key: ${{ secrets.CADDY_SOURCE_APP_PRIVATE_KEY }}
