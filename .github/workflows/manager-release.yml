name: Manager trusted release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: manager-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'DanilFaritovich/portfolio-deployment' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: python -m pip install --quiet -r requirements-dev.txt
      - name: Wait for exact-SHA CI and build twice
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
          CD_MANAGER_BINDINGS_B64: ${{ vars.CD_MANAGER_BINDINGS_B64 }}
        run: python -m scripts.cd.build "$RUNNER_TEMP/manager-release"
      - name: Attest exact bundle bytes
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: portfolio-deployment.zip
          subject-digest: ${{ steps.bundle.outputs.bundle-digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manager-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manager-release/
          if-no-files-found: error
          retention-days: 90
