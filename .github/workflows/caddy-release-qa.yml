name: Real Caddy Release QA

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  attestations: read

concurrency:
  group: caddy-release-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-qa:
    name: Real Caddy release signatures and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout PR code for QA only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      # PR code receives only a read token. Policy B requires the separate
      # protected-source verifier with App credentials; QA cannot replace it.
      - name: Verify historical published release with pinned gh and Sigstore roots
        env:
          GH_TOKEN: ${{ github.token }}
        run: make qa-release-check PYTHON=python
      - name: Verify tracked files unchanged
        run: git diff --exit-code HEAD --
