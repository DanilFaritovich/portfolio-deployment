name: Runtime contract integration

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: runtime-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-integration:
    name: Real Docker runtime contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select integration scope
        id: scope
        run: python3 -m scripts.ci_scope >> "$GITHUB_OUTPUT"
      - name: Set up Python
        if: steps.scope.outputs.run_heavy == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned test dependencies
        if: steps.scope.outputs.run_heavy == 'true'
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Verify disposable runner and local tools
        if: steps.scope.outputs.run_heavy == 'true'
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          cc --version | head -n 1
          docker version --format '{{.Server.Version}}'
          docker compose version
      - name: Test real Compose and Engine without registry or published ports
        if: steps.scope.outputs.run_heavy == 'true'
        run: make runtime-integration-test PYTHON=python RUNTIME_TEST_ENDPOINT=unix:///var/run/docker.sock RUNTIME_TEST_AUTHORIZE=disposable-runtime-integration
      - name: Verify tracked files unchanged
        run: git diff --exit-code HEAD --
