name: Trusted Caddy publication

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    if: >-
      github.event_name == 'push' && github.repository == 'DanilFaritovich/portfolio-deployment' &&
      github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/danilfaritovich/portfolio-caddy
      SOURCE_SHA: ${{ github.sha }}
      GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: python -m pip install --quiet -r requirements-dev.txt
      - name: Reject runtime toolchain drift
        run: python -m scripts.caddy_producer toolchain-check
      - name: Fail closed on unapproved source policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.caddy_producer publish-guard
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: caddy-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/caddy-build
      - name: Load exactly the checked build
        run: |
          docker load --input "$RUNNER_TEMP/caddy-build/image.tar" > /dev/null
          docker image inspect "$IMAGE:sha-$SOURCE_SHA" > "$RUNNER_TEMP/loaded-image.json"
          python -m scripts.caddy_producer_build_check "$RUNNER_TEMP/loaded-image.json" --expected "$RUNNER_TEMP/caddy-build/built-image.json"
          python -m scripts.caddy_producer publication-inputs --directory "$RUNNER_TEMP/caddy-build"
      - name: Upload immutable candidate bytes
        id: image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/publish-docker
        run: |
          mkdir -m 700 "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin > /dev/null
          docker push "$IMAGE:sha-$SOURCE_SHA" > "$RUNNER_TEMP/push.txt"
          python -m scripts.caddy_producer_receipt "$RUNNER_TEMP/push.txt" "$RUNNER_TEMP/publication.json" >> "$GITHUB_OUTPUT"
      - name: Exact-digest isolated Caddy acceptance before signing
        env:
          REFERENCE: ${{ steps.image.outputs.reference }}
          CADDY_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_REF_PROTECTED,GITHUB_ACTOR,CADDY_REGISTRY_TOKEN \
            "$(command -v python)" -m scripts.caddy_producer_acceptance --reference "$REFERENCE" | tee "$RUNNER_TEMP/caddy-acceptance.json"
      - name: Sign digest-bound SLSA provenance
        id: provenance
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/publish-docker
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Sign digest-bound authenticated input evidence
        id: inputs
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/publish-docker
        uses: actions/attest@f057fd524d485ac48d9b534c235aad15b5bb303f # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: https://github.com/DanilFaritovich/portfolio-deployment/attestations/caddy-inputs/v1
          predicate-path: ${{ runner.temp }}/caddy-build/publication-inputs.json
          push-to-registry: true
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caddy-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publication.json
            ${{ runner.temp }}/caddy-acceptance.json
            ${{ runner.temp }}/caddy-build/publication-inputs.json
            ${{ steps.provenance.outputs.bundle-path }}
            ${{ steps.inputs.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
      - name: Remove ephemeral registry authentication
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/publish-docker
        run: docker logout ghcr.io > /dev/null
