# INACTIVE RELEASE CANDIDATE: not admitted to the real registry.
# See ../project-router-acceptance.md for evidence and remaining gates.
apiVersion: portfolio.deployment/v1
kind: Application
metadata:
  id: project-router
  sourceRepository: DanilFaritovich/project-router
spec:
  enabled: false
  components:
  - name: web
    image: ghcr.io/danilfaritovich/project-router@sha256:a393d592331cd556650695f57db74075359d9223c9ebbda080f1a372e9d64853
    platform: linux/amd64
    type: http
    health:
      strategy: http
      path: /en/
    runtimeSecurity:
      apiVersion: portfolio.runtime/v1
      readOnlyRootFilesystem: true
      user: '101:101'
      capDrop: [ALL]
      noNewPrivileges: true
      restart: unless-stopped
      imageHealthcheck: preserve
      tmpfs:
      - target: /tmp
        sizeBytes: 16777216
        mode: '1777'
    port: 8080
  storage:
    type: stateless
  ingress:
    hostname: danil-miftakhov.dev
    component: web
    port: 8080
