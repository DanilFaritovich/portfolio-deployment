# INACTIVE: outside production registry; acceptance never grants admission.
apiVersion: portfolio.deployment/v1
kind: Application
metadata:
  id: project-router
  sourceRepository: DanilFaritovich/project-router
spec:
  enabled: false
  components:
  - name: web
    image: ghcr.io/danilfaritovich/project-router@sha256:a393d592331cd556650695f57db74075359d9223c9ebbda080f1a372e9d64853
    platform: linux/amd64
    type: http
    health:
      strategy: http
      path: /en/
    runtimeSecurity:
      apiVersion: portfolio.runtime/v1
      readOnlyRootFilesystem: true
      user: 101:101
      capDrop:
      - ALL
      noNewPrivileges: true
      restart: unless-stopped
      imageHealthcheck: preserve
      tmpfs:
      - target: /tmp
        sizeBytes: 16777216
        mode: '1777'
    port: 8080
  storage:
    type: stateless
  ingress:
    hostname: danil-miftakhov.dev
    component: web
    port: 8080
release:
  apiVersion: portfolio.acceptance/v1
  components:
    web:
      sourceSha: 526c765f33932e163392dd1d512de4aa2f2a5260
      signerSha: 526c765f33932e163392dd1d512de4aa2f2a5260
      signerWorkflow: .github/workflows/publish.yml
      sourceRef: refs/heads/main
      attestations:
      - predicateType: https://slsa.dev/provenance/v1
      - predicateType: https://github.com/DanilFaritovich/project-router/attestations/build-origin/v1
        expectedPredicate:
          sourceRepository: DanilFaritovich/project-router
          sourceSha: 526c765f33932e163392dd1d512de4aa2f2a5260
          sourceRef: refs/heads/main
          platform: linux/amd64
          buildArguments:
            VITE_SITE_ORIGIN: https://danil-miftakhov.dev
          originOutputVerified: true
          runId: '39776962924'
          runAttempt: '1'
